  <text x="35" y="691" class="row-label">Resiliency</text>

  <rect x="185" y="664" width="230" height="72" class="cell"/>
  <text x="200" y="707" class="cell-label">Backup &amp; restore</text>

  <rect x="430" y="664" width="230" height="72" class="cell"/>
  <text x="445" y="707" class="cell-label">Disaster recovery</text>

  <rect x="675" y="664" width="230" height="72" class="cell"/>
  <text x="690" y="707" class="cell-label">High availability</text>

  <!-- Service management -->
  <text x="30" y="790" class="row-label">
    <tspan x="30" dy="0">Service</tspan>
    <tspan x="30" dy="25">management</tspan>
  </text>

  <rect x="185" y="760" width="230" height="72" class="highlight"/>
  <text x="205" y="803" class="highlight-label">Monitoring</text>

  <rect x="430" y="760" width="230" height="72" class="highlight"/>
  <text x="450" y="803" class="highlight-label">Logging</text>

  <rect x="675" y="760" width="230" height="72" class="highlight"/>
  <text x="695" y="803" class="highlight-label">Auditing/tracking</text>

  <rect x="920" y="760" width="230" height="72" class="cell"/>
  <text x="935" y="803" class="cell-label">Alerting</text>

  <rect x="1165" y="760" width="230" height="72" class="cell"/>
  <text x="1180" y="803" class="cell-label">Event management</text>

  <rect x="1410" y="760" width="270" height="72" class="highlight"/>
  <text x="1430" y="803" class="highlight-label">Automated deployment</text>

  <rect x="1695" y="760" width="180" height="72" class="cell"/>
  <text x="1710" y="792" class="cell-label">
    <tspan x="1710" dy="0">Management/</tspan>
    <tspan x="1710" dy="25">orchestration</tspan>
  </text>

  <!-- Bottom separator -->
  <line x1="0" y1="870" x2="1880" y2="870" class="separator"/>

  <!-- Legend -->
  <rect x="185" y="900" width="28" height="28" class="highlight"/>
  <text x="230" y="922" class="label">Included in this architecture</text>

  <text x="185" y="970" class="label">
    Highlighted capabilities are provided by the VPC landing zone, SAP VSIs,
    network services, storage, monitoring, security, and deployment automation.
  </text>

  <text x="185" y="1002" class="label">
    The default deployment is single-zone and does not provide native high availability or disaster recovery.
  </text>

</svg>