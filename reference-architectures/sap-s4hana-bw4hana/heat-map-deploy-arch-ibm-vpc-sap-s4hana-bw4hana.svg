  <rect x="430" y="304" width="230" height="72" class="cell"/>
  <text x="445" y="347" class="cell-label">Backup</text>

  <rect x="675" y="304" width="230" height="72" class="highlight"/>
  <text x="695" y="347" class="highlight-label">Archive</text>

  <rect x="920" y="304" width="230" height="72" class="cell"/>
  <text x="935" y="347" class="cell-label">Data migration</text>

