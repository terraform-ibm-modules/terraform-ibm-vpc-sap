  <text x="205" y="515" class="highlight-label">Data security</text>

  <rect x="430" y="472" width="230" height="72" class="highlight"/>
  <text x="450" y="515" class="highlight-label">Identity &amp; access</text>

  <rect x="675" y="472" width="230" height="72" class="highlight"/>
  <text x="695" y="515" class="highlight-label">Application security</text>

  <rect x="920" y="472" width="230" height="72" class="highlight"/>
  <text x="940" y="504" class="highlight-label">
    <tspan x="940" dy="0">Infrastructure &amp;</tspan>
    <tspan x="940" dy="25">endpoints</tspan>
  </text>

  <rect x="1165" y="472" width="230" height="72" class="highlight"/>
  <text x="1185" y="504" class="highlight-label">
