<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1900"
     height="1030"
     viewBox="0 0 1900 1030"
     role="img"
     aria-labelledby="title description">

  <title id="title">
    Design requirements heat map for SAP S/4HANA and SAP BW/4HANA on IBM Cloud VPC
  </title>

  <desc id="description">
    IBM Cloud reference architecture design requirements heat map showing the
    application, data, compute, storage, networking, security, DevOps,
    resiliency, and service management capabilities included in the solution.
  </desc>

  <rect x="0" y="0" width="1900" height="1030" fill="#ffffff"/>

  <style>
    .label {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 21px;
      fill: #161616;
    }

    .row-label {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      fill: #161616;
    }

    .cell-label {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      fill: #161616;
    }

    .highlight-label {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: #161616;
    }

    .header-line {
      stroke: #b7b7b7;
      stroke-width: 2;
    }

    .cell {
      fill: #ffffff;
      stroke: #b7b7b7;
      stroke-width: 2;
    }

    .highlight {
      fill: #edf4ff;
      stroke: #0f62fe;
      stroke-width: 2;
    }

    .separator {
      stroke: #b7b7b7;
      stroke-width: 2;
    }
  </style>

  <!-- Headings -->
  <text x="30" y="44" class="label" font-weight="700">Aspect</text>
  <text x="185" y="44" class="label" font-weight="700">Domain</text>

  <line x1="155" y1="0" x2="155" y2="980" class="header-line"/>

  <!-- Application platforms -->
  <text x="30" y="112" class="row-label">
    <tspan x="30" dy="0">Application</tspan>
    <tspan x="30" dy="25">platforms</tspan>
  </text>

  <rect x="185" y="52" width="230" height="72" class="cell"/>
  <text x="200" y="95" class="cell-label">Mobile</text>

  <rect x="430" y="52" width="230" height="72" class="cell"/>
  <text x="445" y="95" class="cell-label">Edge</text>

  <rect x="675" y="52" width="230" height="72" class="cell"/>
  <text x="690" y="95" class="cell-label">Blockchain</text>

  <rect x="920" y="52" width="230" height="72" class="highlight"/>
  <text x="940" y="84" class="highlight-label">
    <tspan x="940" dy="0">Enterprise</tspan>
    <tspan x="940" dy="25">applications</tspan>
  </text>

