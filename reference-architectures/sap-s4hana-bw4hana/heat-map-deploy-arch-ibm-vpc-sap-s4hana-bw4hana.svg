  <text x="55" y="188" class="row-label">Data</text>

  <rect x="185" y="136" width="230" height="72" class="highlight"/>
  <text x="200" y="168" class="highlight-label">
    <tspan x="200" dy="0">Application</tspan>
    <tspan x="200" dy="25">integration</tspan>
  </text>

  <rect x="430" y="136" width="230" height="72" class="cell"/>
  <text x="445" y="179" class="cell-label">Data Ops</text>

  <rect x="675" y="136" width="230" height="72" class="cell"/>
  <text x="690" y="179" class="cell-label">Data analytics</text>

  <rect x="920" y="136" width="230" height="72" class="cell"/>
  <text x="935" y="179" class="cell-label">Data storage</text>

  <rect x="1165" y="136" width="230" height="72" class="cell"/>
  <text x="1180" y="179" class="cell-label">Business intelligence</text>

  <rect x="1410" y="136" width="270" height="72" class="cell"/>
  <text x="1425" y="179" class="cell-label">Artificial intelligence</text>

