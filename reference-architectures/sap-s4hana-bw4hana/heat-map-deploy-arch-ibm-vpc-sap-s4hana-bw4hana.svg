  <text x="35" y="420" class="row-label">Networking</text>

  <rect x="185" y="388" width="230" height="72" class="highlight"/>
  <text x="200" y="420" class="highlight-label">
    <tspan x="200" dy="0">Enterprise</tspan>
    <tspan x="200" dy="25">connectivity</tspan>
  </text>

  <rect x="430" y="388" width="230" height="72" class="cell"/>
  <text x="445" y="431" class="cell-label">BYOIP/Edge gateways</text>

  <rect x="675" y="388" width="230" height="72" class="highlight"/>
  <text x="695" y="431" class="highlight-label">Load balancing</text>

  <rect x="920" y="388" width="230" height="72" class="highlight"/>
  <text x="940" y="420" class="highlight-label">
    <tspan x="940" dy="0">Cloud native</tspan>
    <tspan x="940" dy="25">connectivity</tspan>
  </text>

  <rect x="1165" y="388" width="230" height="72" class="highlight"/>
  <text x="1190" y="431" class="highlight-label">Isolation</text>

  <rect x="1410" y="388" width="270" height="72" class="cell"/>
