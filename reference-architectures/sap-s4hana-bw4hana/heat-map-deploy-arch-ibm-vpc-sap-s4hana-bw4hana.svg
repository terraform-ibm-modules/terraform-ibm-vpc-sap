  <rect x="430" y="220" width="230" height="72" class="highlight"/>
  <text x="450" y="263" class="highlight-label">Virtual servers</text>

  <rect x="675" y="220" width="230" height="72" class="cell"/>
  <text x="690" y="263" class="cell-label">Virtualization</text>

  <rect x="920" y="220" width="230" height="72" class="cell"/>
  <text x="935" y="263" class="cell-label">Containers</text>

  <rect x="1165" y="220" width="230" height="72" class="cell"/>
  <text x="1180" y="263" class="cell-label">Cloud Foundry</text>

  <rect x="1410" y="220" width="270" height="72" class="cell"/>
  <text x="1425" y="263" class="cell-label">Serverless</text>

